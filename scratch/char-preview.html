<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Character preview</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; background: #fff; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cell { background: #EFEFEF; border-radius: 10px; padding: 4px; }
  .cell b { font-size: 11px; display: block; text-align: center; }
  svg { width: 100%; height: 170px; display: block; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script src="../js/character.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const gender = params.get('g') || 'male';
  const only = params.get('id');
  const grid = document.getElementById('grid');
  BoneCharacter.ids().filter(id => !only || id === only).forEach(id => {
    const d = BoneCharacter.duration(id);
    const times = only ? [0, d * 0.15, d * 0.3, d * 0.45, d * 0.6, d * 0.75, d * 0.9] : [0, d * 0.4];
    times.forEach(t => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = `<svg viewBox="${BoneCharacter.VIEWBOX}">${BoneCharacter.renderFrame(id, t, gender)}</svg><b>${id.replace('ex_', '')} @${t.toFixed(1)}s</b>`;
      grid.appendChild(cell);
    });
  });
</script>
</body>
</html>

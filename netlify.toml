# Netlify: connect the repo. The "build" only copies the public files into dist/ so
# working files (scratch/, tests/, .agents/, the .pptx) are never published.
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -r index.html admin.html manifest.webmanifest sw.js robots.txt css js assets dist/"

# AI assistant: a Netlify Function holds the Groq key (set GROQ_API_KEY in the site's
# environment variables) and is served at /api/chat.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["js/data.js", "server/assistant.js"]

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# HTML, service worker and config must revalidate so deploys show up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"

# Versioned CSS/JS (?v=) and static media can be cached hard.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
